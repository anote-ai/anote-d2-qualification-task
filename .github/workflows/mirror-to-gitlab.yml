name: Mirror to GitLab

# Mirrors this repository and the published container image to the GitLab project
# that JHU/APL evaluates from (ICD section 4).
#
#   - Code:  all branches and tags are pushed to https://gitlab.com/<GITLAB_PROJECT>.
#   - Image: the already-published GHCR image is copied byte-for-byte with skopeo
#            (no rebuild), so the GitLab digest is identical to the GHCR digest.
#            Destination: registry.gitlab.com/<GITLAB_PROJECT>/anote-d2-qualification-task:<tag>
#   - Access: checks that @D2-evaluator is a Reporter on the project, and adds it if the
#            token has the `api` scope.
#
# Required repository secrets:
#   GITLAB_USER     GitLab username
#   GITLAB_PROJECT  <namespace>/<project>, e.g. myuser/anote-d2-qualification-task
#   GITLAB_TOKEN    Personal Access Token with scopes: api, write_repository, write_registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to mirror"
        required: true
        default: "v1.3.0"

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: anote-d2-qualification-task
  TAG: ${{ github.event.inputs.tag }}
  EVALUATOR: D2-evaluator

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITLAB_USER: ${{ secrets.GITLAB_USER }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$GITLAB_USER" ] || missing="$missing GITLAB_USER"
          [ -n "$GITLAB_PROJECT" ] || missing="$missing GITLAB_PROJECT"
          [ -n "$GITLAB_TOKEN" ] || missing="$missing GITLAB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror code to GitLab
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git"
          git push gitlab "HEAD:refs/heads/main" --force
          git push gitlab --tags

      - name: Copy image to GitLab registry (same digest, no rebuild)
        id: copy
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          project=$(echo "$GITLAB_PROJECT" | tr '[:upper:]' '[:lower:]')
          src="docker://ghcr.io/$owner/$repo/$IMAGE_NAME:$TAG"
          dst="docker://registry.gitlab.com/$project/$IMAGE_NAME:$TAG"
          skopeo copy --all --preserve-digests --retry-times 3 \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "$GITLAB_USER:$GITLAB_TOKEN" \
            "$src" "$dst"
          src_digest=$(skopeo inspect --raw --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "$src" | sha256sum | cut -d' ' -f1)
          dst_digest=$(skopeo inspect --raw --creds "$GITLAB_USER:$GITLAB_TOKEN" "$dst" | sha256sum | cut -d' ' -f1)
          echo "GHCR digest:   sha256:$src_digest"
          echo "GitLab digest: sha256:$dst_digest"
          if [ "$src_digest" != "$dst_digest" ]; then
            echo "::error::Digest mismatch after copy"; exit 1
          fi
          echo "image=registry.gitlab.com/$project/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$dst_digest" >> "$GITHUB_OUTPUT"

      - name: Ensure @D2-evaluator is a Reporter
        id: access
        continue-on-error: true
        run: |
          api=https://gitlab.com/api/v4
          pid=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$GITLAB_PROJECT")
          uid=$(curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/users?username=$EVALUATOR" | python3 -c "import json,sys;u=json.load(sys.stdin);print(u[0]['id'] if u else '')")
          if [ -z "$uid" ]; then echo "::warning::Could not look up @$EVALUATOR (token needs the api scope). Invite it manually."; echo "status=unknown" >> "$GITHUB_OUTPUT"; exit 0; fi
          level=$(curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/projects/$pid/members/all/$uid" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_level',''))" 2>/dev/null || true)
          if [ -n "$level" ] && [ "$level" -ge 20 ]; then
            echo "@$EVALUATOR already has access level $level"; echo "status=member" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -s -o /tmp/add.json -w '%{http_code}' -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data "user_id=$uid&access_level=20" "$api/projects/$pid/members")
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            echo "@$EVALUATOR added as Reporter"; echo "status=member" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not add @$EVALUATOR (HTTP $code): $(cat /tmp/add.json). Invite it manually as Reporter."
            echo "status=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Submission fields
        run: |
          {
            echo "## D2 qualification submission fields (GitLab)"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Team Name | Anote |"
            echo "| GitLab Username | $GITLAB_USER |"
            echo "| Project URL | https://gitlab.com/$GITLAB_PROJECT |"
            echo "| Container Image | \`${{ steps.copy.outputs.image }}\` |"
            echo "| Image Tag | \`$TAG\` |"
            echo "| Image Digest | \`${{ steps.copy.outputs.digest }}\` |"
            echo "| @$EVALUATOR Reporter | ${{ steps.access.outputs.status == 'member' && 'confirmed' || 'check manually' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
