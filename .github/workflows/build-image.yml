name: Build D2 qualification image

# Builds the submission container on GitHub, smoke-tests it with the ICD run command,
# validates the output, ClamAV-scans the filesystem, and pushes it to:
#   - GitHub Container Registry (always):  ghcr.io/<owner>/anote-d2-qualification-task:<tag>
#   - GitLab Container Registry (only if the GITLAB_* secrets are set), which is where
#     the ICD (section 4) says JHU/APL pulls from.
# The submission fields (image name, tag, digest) are written to the run summary.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "v1.3.0"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "inference.py"
      - "entrypoint.sh"
      - "d2/**"
      - "model/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: anote-d2-qualification-task
  TAG: ${{ github.event.inputs.tag || 'v1.3.0' }}
  HAS_GITLAB: ${{ secrets.GITLAB_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk (image is ~11 GB uncompressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build
        run: docker build --platform linux/amd64 -t "$IMAGE_NAME:$TAG" .

      - name: Smoke test with the ICD run command (offline, read-only input)
        run: |
          mkdir -p /tmp/in /tmp/out
          docker run --rm --network none --entrypoint python -v /tmp/in:/in "$IMAGE_NAME:$TAG" -c "
          from PIL import Image
          for i, size in enumerate([(4032, 3024), (3024, 4032), (1920, 1080)]):
              Image.new('RGB', size, (120 + 40 * i, 90, 80)).save(f'/in/smoke_{i}.jpg')
          Image.new('RGB', (800, 600), (20, 20, 20)).save('/in/smoke_3.png')
          "
          chmod 777 /tmp/out
          docker run --rm --network none -v /tmp/in:/app/input:ro -v /tmp/out:/app/output:rw "$IMAGE_NAME:$TAG"
          python3 validate_predictions.py /tmp/out/predictions.json

      - name: ClamAV scan (ICD 3.5)
        run: |
          mkdir -p /tmp/fs
          cid=$(docker create "$IMAGE_NAME:$TAG")
          docker export "$cid" | tar -xC /tmp/fs
          docker rm "$cid"
          docker run --rm -v /tmp/fs:/scandir:ro clamav/clamav:latest clamscan -r -i --max-filesize=4000M --max-scansize=4000M /scandir
          sudo rm -rf /tmp/fs

      - name: Push to GitHub Container Registry
        id: ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/$owner/$IMAGE_NAME:$TAG"
          docker tag "$IMAGE_NAME:$TAG" "$ref"
          docker push "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Push to GitLab Container Registry (if configured)
        id: gitlab
        env:
          GITLAB_USER: ${{ secrets.GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
        if: env.HAS_GITLAB == 'true'
        run: |
          echo "$GITLAB_TOKEN" | docker login registry.gitlab.com -u "$GITLAB_USER" --password-stdin
          project=$(echo "$GITLAB_PROJECT" | tr '[:upper:]' '[:lower:]')
          ref="registry.gitlab.com/$project/$IMAGE_NAME:$TAG"
          docker tag "$IMAGE_NAME:$TAG" "$ref"
          docker push "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Submission fields
        run: |
          {
            echo "## D2 qualification submission fields"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Team Name | Anote |"
            echo "| Image Tag | \`$TAG\` |"
            echo "| GHCR image | \`${{ steps.ghcr.outputs.ref }}\` |"
            echo "| GHCR digest | \`${{ steps.ghcr.outputs.digest }}\` |"
            if [ -n "${{ steps.gitlab.outputs.ref }}" ]; then
              echo "| GitLab Username | ${{ secrets.GITLAB_USER }} |"
              echo "| Project URL | https://gitlab.com/${{ secrets.GITLAB_PROJECT }} |"
              echo "| Image Name | \`${{ steps.gitlab.outputs.ref }}\` |"
              echo "| Image Digest | \`${{ steps.gitlab.outputs.digest }}\` |"
            else
              echo ""
              echo "GitLab push skipped (GITLAB_USER / GITLAB_TOKEN / GITLAB_PROJECT secrets not set)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
